<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c7a7b"/><stop offset="1" stop-color="#006162"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bec9c8"/></marker></defs>
<rect width="1200" height="300" rx="18" fill="#faf9f6" stroke="#bec9c8"/><text x="600" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1c1a" text-anchor="middle" letter-spacing="0.2" opacity="1">The shift lifecycle</text><rect x="37" y="62" width="176" height="138" rx="14" fill="#ffffff" stroke="#bec9c8" stroke-width="1"/><circle cx="65" cy="92" r="14" fill="#d3ecec"/><text x="65" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#006162" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="89" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Post a shift</text><text x="55" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Role, time, pay range,</text><text x="55" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">GPS location</text><path d="M214 131 H226" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="227" y="62" width="176" height="138" rx="14" fill="#ffffff" stroke="#bec9c8" stroke-width="1"/><circle cx="255" cy="92" r="14" fill="#d3ecec"/><text x="255" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#006162" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="279" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Crew pinged</text><text x="245" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Nearby available crew</text><text x="245" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">see it at once</text><path d="M404 131 H416" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="417" y="62" width="176" height="138" rx="14" fill="#ffffff" stroke="#bec9c8" stroke-width="1"/><circle cx="445" cy="92" r="14" fill="#d3ecec"/><text x="445" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#006162" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="469" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Accept or counter</text><text x="435" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Counters bounded to</text><text x="435" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">your pay range</text><path d="M594 131 H606" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="607" y="62" width="176" height="138" rx="14" fill="#ffffff" stroke="#bec9c8" stroke-width="1"/><circle cx="635" cy="92" r="14" fill="#d3ecec"/><text x="635" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#006162" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="659" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Matched</text><text x="625" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Escrow hold opens,</text><text x="625" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">split shown to both</text><path d="M784 131 H796" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="797" y="62" width="176" height="138" rx="14" fill="#ffffff" stroke="#bec9c8" stroke-width="1"/><circle cx="825" cy="92" r="14" fill="#d3ecec"/><text x="825" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#006162" text-anchor="middle" letter-spacing="0" opacity="1">5</text><text x="849" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Check in</text><text x="815" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">4-digit proximity code</text><text x="815" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">shown to both parties</text><path d="M974 131 H986" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="987" y="62" width="176" height="138" rx="14" fill="#ffffff" stroke="#fe9569" stroke-width="2"/><circle cx="1015" cy="92" r="14" fill="#fe9569"/><text x="1015" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#994621" text-anchor="middle" letter-spacing="0" opacity="1">6</text><text x="1039" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Approved</text><text x="1005" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Hold releases,</text><text x="1005" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">payout requested</text><text x="600" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3f4949" text-anchor="middle" letter-spacing="0" opacity="1">Unclaimed requests auto-expire after 12 hours · the escrow hold freezes if either side raises a dispute</text>
