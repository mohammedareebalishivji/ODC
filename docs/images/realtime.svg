<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c7a7b"/><stop offset="1" stop-color="#006162"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bec9c8"/></marker></defs>
<rect width="1000" height="320" rx="18" fill="#faf9f6" stroke="#bec9c8"/><text x="500" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1c1a" text-anchor="middle" letter-spacing="0" opacity="1">How an event reaches a browser</text><rect x="48" y="96" width="190" height="74" rx="14" fill="#ffffff" stroke="#bec9c8"/><text x="143" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="middle" letter-spacing="0" opacity="1">A write happens</text><text x="143" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="middle" letter-spacing="0" opacity="1">message, response, presence</text><rect x="300" y="96" width="190" height="74" rx="14" fill="#ffffff" stroke="#006162"/><text x="395" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="middle" letter-spacing="0" opacity="1">In-process bus</text><text x="395" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="middle" letter-spacing="0" opacity="1">audience named per event</text><rect x="552" y="96" width="190" height="74" rx="14" fill="#ffffff" stroke="#006162"/><text x="647" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="middle" letter-spacing="0" opacity="1">SSE stream</text><text x="647" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="middle" letter-spacing="0" opacity="1">one per browser tab</text><rect x="804" y="96" width="150" height="74" rx="14" fill="#ffffff" stroke="#bec9c8"/><text x="879" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a1c1a" text-anchor="middle" letter-spacing="0" opacity="1">The tab</text><text x="879" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="middle" letter-spacing="0" opacity="1">renders instantly</text><path d="M242 133 H292" stroke="#2c7a7b" stroke-width="2" marker-end="url(#a)"/><path d="M494 133 H544" stroke="#2c7a7b" stroke-width="2" marker-end="url(#a)"/><path d="M746 133 H796" stroke="#2c7a7b" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="196" width="442" height="42" rx="12" fill="#d3ecec" fill-opacity="0.5"/><text x="521" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#006162" text-anchor="middle" letter-spacing="0" opacity="1">Every event names its audience — nothing is broadcast to all listeners</text><path d="M395 170 V278 H382" fill="none" stroke="#fe9569" stroke-width="2" stroke-dasharray="4 4"/><rect x="48" y="258" width="330" height="40" rx="12" fill="#ffffff" stroke="#fe9569" stroke-dasharray="4 4"/><text x="213" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#994621" text-anchor="middle" letter-spacing="0" opacity="1">Supabase Realtime — optional, multi-instance</text><text x="770" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="middle" letter-spacing="0" opacity="1">Polling remains only as a slow safety net</text>
</svg>
