<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c7a7b"/><stop offset="1" stop-color="#006162"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bec9c8"/></marker></defs>
<rect width="900" height="200" rx="16" fill="#faf9f6" stroke="#bec9c8"/><text x="32" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">If you run a venue</text><rect x="32" y="52" width="46" height="3" rx="1.5" fill="#006162"/><rect x="32" y="78" width="188" height="100" rx="13" fill="#ffffff" stroke="#bec9c8"/><circle cx="62" cy="110" r="16" fill="#d3ecec"/><g transform="translate(62 110) scale(0.8000) translate(-12 -12)"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#006162"/></g><text x="88" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Post a shift</text><text x="48" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Role, specialty, time, pay</text><text x="48" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">range</text><path d="M223 128 H239" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="244" y="78" width="188" height="100" rx="13" fill="#ffffff" stroke="#bec9c8"/><circle cx="274" cy="110" r="16" fill="#d3ecec"/><g transform="translate(274 110) scale(0.8000) translate(-12 -12)"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.93 6 11v5l-2 2v1h16v-1l-2-2z" fill="#006162"/></g><text x="300" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Watch the desk</text><text x="260" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Applicants queue with their</text><text x="260" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">split</text><path d="M435 128 H451" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="456" y="78" width="188" height="100" rx="13" fill="#ffffff" stroke="#bec9c8"/><circle cx="486" cy="110" r="16" fill="#d3ecec"/><g transform="translate(486 110) scale(0.8000) translate(-12 -12)"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#006162"/></g><text x="512" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Lock one in</text><text x="472" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Escrow opens the moment you</text><text x="472" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">accept</text><path d="M647 128 H663" stroke="#bec9c8" stroke-width="1.6" marker-end="url(#a)"/><rect x="668" y="78" width="188" height="100" rx="13" fill="#ffffff" stroke="#bec9c8"/><circle cx="698" cy="110" r="16" fill="#d3ecec"/><circle cx="698" cy="110" r="7.84" fill="none" stroke="#006162" stroke-width="1.36"/><text x="698" y="113.36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9.92" font-weight="700" fill="#006162">₹</text><text x="724" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1a1c1a" text-anchor="start" letter-spacing="0" opacity="1">Approve</text><text x="684" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">Release the payout after</text><text x="684" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3f4949" text-anchor="start" letter-spacing="0" opacity="1">the shift</text>
</svg>
